<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0b1120"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="url(#grad)" stroke-width="6" opacity="0.4"/>
  
  <!-- Glowing Center Circle -->
  <circle cx="256" cy="256" r="170" fill="url(#grad)" filter="url(#glow)"/>
  
  <!-- Recycle Symbol & E-Waste Circuit Nodes -->
  <g fill="#0b1120" transform="translate(136, 136) scale(0.47)">
    <path d="M256 0c141.4 0 256 114.6 256 256S397.4 512 256 512 0 397.4 0 256 114.6 0 256 0z" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- Clean Stylized Recycle Nodes -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Arrow 1 (Top to Right) -->
    <path d="M230 140 L310 140 L280 110 M310 140 L280 170" fill="none" stroke-width="28"/>
    <!-- Arrow 2 (Right to Bottom-Left) -->
    <path d="M330 280 L290 350 L310 375 M290 350 L250 350" fill="none" stroke-width="28"/>
    <!-- Arrow 3 (Bottom-Left to Top-Left) -->
    <path d="M190 340 L150 270 L115 285 M150 270 L150 310" fill="none" stroke-width="28"/>
    
    <!-- Central Microchip Icon -->
    <rect x="226" y="226" width="60" height="60" rx="12" fill="#0b1120" stroke="#ffffff" stroke-width="12"/>
    <circle cx="256" cy="256" r="10" fill="#38bdf8"/>
    <!-- Pins -->
    <line x1="256" y1="210" x2="256" y2="226" stroke-width="10"/>
    <line x1="256" y1="286" x2="256" y2="302" stroke-width="10"/>
    <line x1="210" y1="256" x2="226" y2="256" stroke-width="10"/>
    <line x1="286" y1="256" x2="302" y2="256" stroke-width="10"/>
  </g>
</svg>
