<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kabadiwala Lite — Scrap Classifier</title>
  <meta name="description" content="Kabadiwala Lite — On-device ML scrap classification for door-to-door e-waste collectors. Snap a photo and get instant material identification.">
  <meta name="application-name" content="KabadiwalaLite">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets — shared + collector-specific -->
  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/collector.css">
  <link rel="stylesheet" href="/src/css/animations.css">
</head>
<body>
  <!-- Device Frame Simulator Container (for Desktop & Responsive Mobile) -->
  <div class="app-viewport-wrapper">
    <div class="app-device-frame" id="appDeviceFrame">

      <!-- Top Status Bar — Collector Identity -->
      <header class="app-topbar" id="appTopBar">
        <div class="app-topbar-left">
          <div class="app-brand">
            <span class="app-brand-icon">♻️</span>
            <span class="app-brand-text">Kabadiwala</span>
            <span class="app-role-badge" id="appRoleBadge" style="background: rgba(14, 165, 233, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3);">Collector Lite</span>
          </div>
        </div>
        <div class="app-topbar-right">
          <!-- No role-switch button — this is the Kabadiwala Lite App -->
        </div>
      </header>

      <!-- Main Dynamic Content Area -->
      <main class="app-content" id="appContent">
        <!-- View screens will be injected here dynamically -->
        <div class="view-loading-spinner" id="initialLoader">
          <div class="spinner"></div>
          <p>Loading Kabadiwala Lite...</p>
        </div>
      </main>

      <!-- Collector Bottom Navigation Bar — Collector Only -->
      <nav class="app-bottom-nav collector-nav" id="collectorBottomNav">
        <button class="nav-item active" data-view="collector-lite">
          <span class="nav-icon">📷</span>
          <span class="nav-label">Scrap Scanner</span>
        </button>
        <button class="nav-item" data-view="collector-info">
          <span class="nav-icon">ℹ️</span>
          <span class="nav-label">Material Guide</span>
        </button>
      </nav>

    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Kabadiwala Lite Application Entry Point -->
  <script type="module" src="/src/js/collector-app.js"></script>
</body>
</html>
